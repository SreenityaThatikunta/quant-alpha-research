<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Liquidity-cost sensitivity</title><desc id="desc">Sharpe ratio for fixed baseline weights at a one-million-dollar notional under increasing half-spread assumptions.</desc>
<style>.axis{fill:#475569;font:13px system-ui,sans-serif}.value{fill:#0f172a;font:600 14px system-ui,sans-serif}.title{fill:#0f172a;font:600 18px system-ui,sans-serif}.label{fill:#475569;font:13px system-ui,sans-serif}</style>
<text x="78" y="32" class="title">Liquidity-cost sensitivity — fixed OOS weights, $1m notional</text>
<line x1="120" x2="900" y1="260" y2="260" stroke="#0f172a" stroke-width="1.5"/>
<text x="108" y="264" text-anchor="end" class="axis">0.00</text><rect x="240" y="201.6" width="110" height="58.4" rx="3" fill="#16a34a"/><text x="295.0" y="284" text-anchor="middle" class="axis">5 bps</text><text x="295.0" y="193.6" text-anchor="middle" class="value">0.34</text><rect x="430" y="260.0" width="110" height="3.8" rx="3" fill="#dc2626"/><text x="485.0" y="284" text-anchor="middle" class="axis">10 bps</text><text x="485.0" y="281.8" text-anchor="middle" class="value">-0.02</text><rect x="620" y="260.0" width="110" height="124.5" rx="3" fill="#dc2626"/><text x="675.0" y="284" text-anchor="middle" class="axis">20 bps</text><text x="675.0" y="402.5" text-anchor="middle" class="value">-0.73</text>
<text x="510" y="340" text-anchor="middle" class="label">Half-spread assumption</text>
<text x="28" y="220" class="label" transform="rotate(-90 28 220)">Sharpe ratio</text>
</svg>